[package]
name = "carbonlauncher"
version = "0.1.0"
description = "A Tauri App"
authors = ["BenMcAvoy <ben.mcavoy@tutanota.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_test_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
tauri = { version = "2.5.1", features = ["protocol-asset"] }
tauri-plugin-opener = "2.2.6"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tauri-plugin-http = "2.4.3"
tauri-plugin-fs = "2.2.1"
tauri-plugin-dialog = "2.2.1"
reqwest = { version = "0.12.15", features = ["blocking"] }
sha2 = "0.10.8"
lazy_static = "1.5.0"

[dependencies.windows]
version = "0.61.1" # or latest
features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",  # For process enumeration (CreateToolhelp32Snapshot, Process32First, etc.)
    "Win32_System_Threading",            # For OpenProcess, CreateRemoteThread, etc.
    "Win32_System_Memory",               # For VirtualAllocEx, WriteProcessMemory, ReadProcessMemory
    "Win32_System_LibraryLoader",        # For LoadLibraryW (used in DLL injection)
]
